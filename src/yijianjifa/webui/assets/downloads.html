<div class="top download-top"><div><h1>视频下载</h1><p>下载视频，或从视频中提取 MP3 音频。</p></div></div>
<div class="download-workspace">
 <section class="download-card">
  <div class="download-actions-bar" role="tablist" aria-label="处理内容"><button id="downloadVideoAction" class="btn" role="tab" aria-selected="true">下载视频</button><button id="downloadAudioAction" class="btn" role="tab" aria-selected="false">提取音频</button></div>
  <div class="download-source-header"><h2 id="downloadSourceTitle">粘贴视频链接</h2><div class="download-source-tabs" role="tablist" aria-label="视频来源"><button id="downloadLinkTab" class="btn" role="tab" aria-selected="true" aria-controls="downloadLinkSource" hidden>视频链接</button><button id="downloadLocalTab" class="btn" role="tab" aria-selected="false" aria-controls="downloadLocalSource" hidden>本地视频</button></div></div>
  <div id="downloadLinkSource" role="tabpanel"><div class="download-source"><textarea id="downloadInput" maxlength="8192" placeholder="粘贴视频分享链接或分享文字，软件会自动读取视频" aria-label="视频或主页链接"></textarea><div class="download-source-buttons"><button id="downloadRead" class="btn" hidden>重新读取</button><button id="downloadReadVisible" class="btn" hidden>登录后继续</button></div></div><p id="downloadLinkHelp" class="download-platform-note">支持视频分享链接、抖音主页和 MP4 链接。请使用你有权下载的内容。</p></div>
  <div id="downloadLocalSource" role="tabpanel" hidden><div id="downloadLocalDrop" class="download-local-drop" tabindex="0" aria-label="拖入本地视频区域"><b>拖入视频，或点击选择视频</b><p>支持 MP4、MOV、M4V，可一次选择多个视频。</p><button id="downloadLocalChoose" class="btn">选择视频</button><button id="downloadLocalCancel" class="btn" hidden>取消接收</button><button id="downloadLocalRetry" class="btn" hidden>重新检查</button><p id="downloadLocalStatus" role="status">尚未选择视频</p><div id="downloadLocalErrors" class="download-local-errors"></div></div><p class="download-platform-note">提取为 MP3 音频，原视频保持不变。</p></div>
  <div class="download-directory"><span>保存到</span><span id="downloadOutputPath">首次使用时选择保存位置</span><button id="downloadChooseOutput" class="btn">更改</button></div>
 </section>
 <section class="download-panel"><div class="download-panel-head"><b id="downloadCatalogTitle">要下载的视频</b><div id="downloadSelection"></div></div><details id="downloadFilters" class="download-filter-fold" hidden><summary>筛选视频</summary><div class="download-filters"><input id="downloadSearch" type="search" maxlength="256" placeholder="输入视频名称" aria-label="筛选已读取作品"><select id="downloadState" aria-label="作品状态"><option value="">全部状态</option><option value="not_downloaded">未下载</option><option value="downloaded">已下载</option><option value="interrupted" hidden disabled>需重新选择</option></select></div></details>
  <div class="download-table-scroll"><table class="download-table"><thead><tr><th>选择</th><th id="downloadColumnTitle">视频名称</th><th>时长</th><th>操作</th></tr></thead><tbody id="downloadRows"></tbody></table></div>
  <div class="download-foot"><span id="downloadCatalogStatus">粘贴链接后自动读取</span><button id="downloadMore" class="btn" hidden>读取更多视频</button></div><div id="downloadPager" class="download-foot p011-pager" hidden><button id="downloadPrev" class="btn">上一页</button><button id="downloadNext" class="btn">下一页</button></div>
  <div class="download-start"><span id="downloadStartStatus">读取完成后，点击开始下载。</span><button id="downloadStart" class="btn primary">开始下载</button></div>
 </section>
 <section id="downloadResults" class="download-panel" hidden></section>
 <details id="downloadPreviewPanel" class="download-fold" hidden><summary>预览</summary><div class="download-preview"><h3 id="downloadActiveTitle">视频预览</h3><p id="downloadPreviewState">在视频列表中点击预览。</p><video id="downloadPlayer" controls preload="metadata"></video><div class="download-actions"><button id="downloadPreparePreview" class="btn">加载预览</button></div></div></details>
 <details id="downloadHistoryPanel" class="download-fold"><summary>下载记录</summary><section class="download-panel"><div class="download-panel-head"><b id="downloadTasksTitle">历史任务</b><span class="muted">切换页面后也会继续处理</span></div><div id="downloadTaskRows"></div><div id="downloadTasksPager" class="download-foot p011-pager"><button id="downloadTaskPrev" class="btn">上一页</button><button id="downloadTaskNext" class="btn">下一页</button></div></section></details>
</div></main></div><div id="downloadModal" class="download-modal"><div id="downloadDialog" class="download-dialog" role="dialog" aria-modal="true"></div></div><div id="toast" class="toast" role="status"></div></body></html>
