<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>一剪即发 · 配音管理</title><style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#e6eaf0;--text:#18212f;--sub:#6b7280;--blue:#2563eb;--blue2:#eff6ff;--green:#16a34a;--amber:#d97706;--red:#dc2626;--shadow:0 10px 28px rgba(15,23,42,.06)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.brand{font-size:20px;font-weight:800;padding:8px 10px 18px}.brand small{display:block;color:var(--sub);font-size:12px;font-weight:500;margin-top:3px}
.nav{display:grid;gap:4px}.nav div,.nav button{padding:11px 12px;border-radius:9px;color:#334155}.nav button{border:0;background:transparent;text-align:left;font:inherit;cursor:pointer}.nav button:disabled:not(.on){opacity:.45;cursor:default}.nav .on{background:var(--blue);color:#fff;font-weight:700}
main{padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}h1{margin:0;font-size:26px}.sub,.muted{color:var(--sub)}
.btn{border:1px solid #d7deea;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:650}.btn:hover{background:#f8fafc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.soft{background:var(--blue2);border-color:#bfdbfe;color:#1d4ed8}.btn.danger{color:#b91c1c}
.tabs{display:flex;gap:7px;margin-bottom:13px}.tab{padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.tab.on{background:var(--blue2);color:#1d4ed8;border-color:#bfdbfe;font-weight:700}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:14px;box-shadow:var(--shadow)}
input,select{border:1px solid #d8dee9;border-radius:8px;padding:8px 10px;background:#fff}.search{min-width:260px}.grow{flex:1}.check{width:16px;height:16px}
.layout{display:grid;grid-template-columns:minmax(640px,1.18fr) minmax(370px,.82fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.ph b{font-size:16px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:middle}th{font-size:12px;color:#64748b;background:#fafbfc}.row{cursor:pointer}.row:hover{background:#fafcff}.row.active{background:#eff6ff}
.tag{display:inline-block;border-radius:999px;padding:3px 7px;font-size:12px;margin-right:4px;background:#f1f5f9}.blue{background:#eff6ff;color:#1d4ed8}.green{background:#ecfdf5;color:#15803d}.amber{background:#fff7ed;color:#b45309}.red{background:#fef2f2;color:#b91c1c}.purple{background:#f5f3ff;color:#6d28d9}
.detail{padding:16px}.card{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}.card h3{font-size:15px;margin:0 0 9px}.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px}.k{color:#64748b}.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}
.notice{padding:10px 11px;border-radius:9px;background:#eff6ff;color:#1e40af;margin-bottom:12px}.notice.warn{background:#fff7ed;color:#9a3412}.notice.red{background:#fef2f2;color:#b91c1c}
.setting-wrap{display:none}.setting-wrap.on{display:block}.preset-wrap.hidden{display:none}
.setting-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:13px}.setting-card h2{font-size:16px;margin:0 0 4px}.setting-row{display:grid;grid-template-columns:230px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #edf1f5}.setting-row:first-of-type{border-top:0}.setting-title{font-weight:700}.path{background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:9px 10px;word-break:break-all}
.switch{position:relative;width:42px;height:24px;border-radius:999px;background:#cbd5e1;cursor:pointer}.switch:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.15s}.switch.on{background:#2563eb}.switch.on:after{left:21px}
.ctx{position:fixed;display:none;background:#fff;border:1px solid #d9e0ea;border-radius:9px;box-shadow:0 16px 40px rgba(15,23,42,.16);padding:5px;z-index:30;min-width:170px}.ctx button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:#fff;border-radius:6px;cursor:pointer}.ctx button:hover{background:#f1f5f9}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:10px 13px;border-radius:8px;display:none;z-index:50}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.36);display:none;place-items:center;z-index:40}.dialog{width:min(560px,92vw);max-height:86vh;overflow:auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 25px 70px rgba(15,23,42,.25)}.dialog h3{margin:0 0 10px}.field{margin:11px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}


.voice-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;flex:1;min-height:0;margin:0 20px 16px}.voice-layout>.panel{display:flex;flex-direction:column;min-width:0;min-height:0}.voice-filters{display:flex;gap:8px;padding:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.voice-filters input[type=search]{flex:1;min-width:170px}.voice-filters select{max-width:145px}.voice-filters label{display:flex;align-items:center;gap:6px}.voice-scroll{flex:1;min-height:0;overflow:auto}.voice-scroll th{position:sticky;top:0;z-index:1}.voice-scroll tr[aria-selected=true]{background:var(--soft)}.voice-scroll tr:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}.voice-scroll .name{font-weight:600}.voice-scroll small{display:block;color:var(--sub)}.voice-scroll .btn{white-space:nowrap}.voice-foot{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}.voice-foot span{margin-right:auto}.voice-detail{flex:1;min-height:0;overflow:auto;padding:16px}.voice-detail h2{margin:0 0 4px}.voice-detail .line{margin:12px 0}.voice-section{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.voice-section h3{margin:0 0 6px}.voice-section p{margin:6px 0 12px}.voice-section textarea{width:100%;height:155px;resize:vertical;min-height:90px;border:1px solid #d8e0ef;border-radius:8px;padding:10px}.voice-section .line{justify-content:space-between}.voice-section input[type=number]{width:86px}.voice-section label{display:flex;align-items:center;gap:8px}audio{width:100%;margin-top:10px}.voice-current{padding:10px 12px;background:#f8faff;border-top:1px solid var(--line);font-size:12px}.form-grid{display:grid;grid-template-columns:1fr;gap:14px}.form-grid label{display:grid;gap:6px}.form-grid input{width:100%}.btn:disabled{opacity:.45;cursor:default}.voice-empty{text-align:center;padding:35px;color:var(--sub)}#toast{max-width:550px;z-index:200}.modal{z-index:100}.dialog h2{margin:0 0 12px}.status{font-size:12px;color:var(--sub)}
.cloud-password-error{color:var(--red);font-size:13px}.cloud-test-notice{flex:none;margin:0 20px 12px}.cloud-test-notice[hidden]{display:none}.cloud-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#f8faff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 20px 14px}.cloud-bar .line{margin:0}.cloud-usage{max-height:360px;overflow:auto}.cloud-usage p{padding:10px 0;border-bottom:1px solid var(--line)}.foot{flex-wrap:wrap}
.cloud-redeem-field{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0;margin:16px 0}.cloud-redeem-field input{display:block;width:100%;min-width:0;font:inherit}
.cloud-account-overview{padding:16px;background:#f8faff;border:1px solid var(--line);border-radius:10px}.cloud-account-name{display:block;font-size:20px;overflow-wrap:anywhere}.cloud-account-balance{margin:8px 0 0;font-size:16px}.cloud-account-settings{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.cloud-account-settings>summary{cursor:pointer;color:var(--sub);font-weight:600;padding:4px 0}.cloud-account-settings>summary:focus-visible{outline:2px solid var(--blue);outline-offset:4px}.cloud-account-action{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.cloud-account-action p{font-size:13px;margin:4px 0 0}.cloud-account-action .btn{white-space:nowrap}@media(max-width:540px){.cloud-account-action{grid-template-columns:minmax(0,1fr)}.cloud-account-action>.btn{justify-self:start}}
@media(max-width:1100px){.voice-layout{grid-template-columns:minmax(0,1fr) 300px}.voice-filters select{max-width:125px}}
.voice-current{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.voice-current p{flex-basis:100%;margin:0;font-size:12px}
</style></head><body><div class="shell"><aside class="side"><div class="brand p011-brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5 21 20M8.5 16.5 21 4M14 12l7-8"/></svg></div><div><b>一剪即发</b><small>一键剪辑 · 一键发布</small></div></div>
<div class="nav"></div></aside><main><div class="top"><div><h1>配音管理</h1><p id="freeUsageNotice" class="sub">软件与系统配音免费。云配音可选，按成功字数收费。</p></div></div><p id="cloudTestNotice" class="notice warn cloud-test-notice" hidden></p><div class="cloud-bar"><strong id="cloudStatus" role="status">正在读取配音字数…</strong><div class="line"><button id="cloudAccount" class="btn">登录云配音</button><button id="cloudRedeem" class="btn primary">兑换码充值</button><button id="cloudUsage" class="btn">用量记录</button></div></div><div class="voice-layout"><section class="panel"><div class="ph"><b>音色库</b><span id="voiceTotal" class="muted"></span></div><div class="voice-filters"><input type="search" id="voiceSearch" placeholder="搜索音色名称" aria-label="搜索音色"><select id="genderFilter" aria-label="筛选男女声"><option value="">全部声音</option><option>女声</option><option>男声</option></select><select id="sceneFilter" aria-label="筛选使用场景"><option value="">全部场景</option></select><select id="languageFilter" aria-label="筛选语言"><option value="">全部语言</option></select><label><input id="favoriteOnly" type="checkbox">只看收藏</label></div><div class="voice-scroll"><table><thead><tr><th>音色</th><th>适用场景</th><th>试听</th><th>收藏</th></tr></thead><tbody id="voiceRows"></tbody></table></div><div class="voice-foot p011-pager"><span id="pageInfo" class="muted"></span><button class="btn small" id="prevPage">上一页</button><button class="btn small" id="nextPage">下一页</button><label>跳至 <select id="pageSelect" aria-label="选择音色页码"></select></label></div><div class="voice-current"><span>当前默认配音：<b id="selectedName">系统配音（免费）</b></span><button id="systemVoice" class="btn small" hidden>恢复系统配音（免费）</button><p class="muted">默认使用系统配音；选择音色并点击“使用此音色”后才会切换。</p></div></section><section class="panel"><div class="ph"><b>试听与选择</b></div><div class="voice-detail"><h2 id="activeName">请选择音色</h2><div id="activeMeta" class="muted"></div><p id="voiceAvailability" class="muted" role="status"></p><div class="line"><button id="useVoice" class="btn primary">使用此音色</button><button id="standardAudition" class="btn">听官方示例</button></div><div id="cloudPolicyNotice" hidden><p id="cloudPolicyText"></p><button id="cloudPolicySeen" class="btn small">知道了</button></div><p id="sampleNote" class="muted">官方示例保存在本机，不消耗配音额度。</p><div id="standardPlayer"></div><div class="voice-section"><h3>用自己的文字试听</h3><p class="muted">使用上方音色生成。相同文字、音色和语速会复用本机缓存。</p><textarea id="auditionText" maxlength="8000" placeholder="在这里输入或粘贴一段文字…" aria-label="试听文字"></textarea><div class="line"><span id="textCount" class="muted">0 / 4000 字</span><label>语速<input id="voiceSpeed" type="number" min="0.5" max="2" step="0.1" value="1" aria-label="试听语速"></label></div><button id="customAudition" class="btn primary">生成文字试听</button><p class="muted">生成成功后扣配音字数，已有音频复用不重复扣。汉字、字母、数字、标点、空格和换行均计入字数。</p><div id="customPlayer"></div></div></div></section></div></main></div><div class="modal" id="modal"><div id="dialog" class="dialog" role="dialog" aria-modal="true"></div></div><div id="toast" class="toast" role="status"></div></body></html>
